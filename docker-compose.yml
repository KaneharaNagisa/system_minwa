services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: system_minwa
    restart: unless-stopped
    working_dir: /var/www/html
    command: >
      sh -c "chown -R www-data:www-data /var/www/html/storage /var/www/html/bootstrap/cache
      && if [ ! -e public/storage ]; then php artisan storage:link; fi
      && exec php-fpm"
    volumes:
      - ./src:/var/www/html
      - app_node_modules:/var/www/html/node_modules
    depends_on:
      - db
      - mailpit
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: nginx_minwa
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./src:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - app-network

  db:
    image: mysql:8.0
    container_name: db_minwa
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: db_minwa
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: password
      MYSQL_USER: user
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - app-network
    ports:
      - "3306:3306"

  # --- phpMyAdmin (DB GUI) ---
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    depends_on:
      - db
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 256M
      TZ: Asia/Tokyo
    ports:
      - "8082:80" # ブラウザから http://localhost:8082 でアクセス
    networks:
      - app-network

  # --- Mailpit (Mail Server) ---
  mailpit:
    image: axllent/mailpit
    container_name: mailpit_minwa
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTPポート (Laravelから接続)
      - "8025:8025" # Web UIポート (ブラウザで確認)
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  dbdata:
  app_node_modules:
